# python experiments/bad_initialization/plot_dynamics.py --engine ppo
#
# PPO counterpart of bad_init_idealized.yaml -- same game and same
# `idealized.init_means`, but two knobs differ from the idealized copy:
# `optimizer.learning_rate` is the network's (not the solver's eta), and
# `idealized.init_log_std` is 0.0 rather than 0.1 -- see the note on that key
# below for why the PPO backend needs the wider start. See
# bad_init_idealized.yaml for the scenario this tests, and plot_dynamics.py.
#
# NOTE ON `idealized:` -- `train.py` IGNORES that whole block (see
# `training/run_config.py`); it is read here only by `plot_dynamics.py --engine ppo`,
# which seeds the network's head biases from `init_means`/`init_weights`/`init_log_std`
# via `_seed_heads` (unless you pass `--network-init`). Under a bare
# `python train.py <this file>` the init instead comes from `training.mixture`'s own
# `_spread_bias_init`/`_std_bias_init`, which for this game's [-2, 2] box and 2
# components put the means at exactly -1.0/+1.0 with std 1.0 -- i.e. already on the
# Nash support, so neither initialization is being tested at all. Run this file
# through `plot_dynamics.py`, not `train.py`, if you want the experiment.

game:
  name: multi_point
  peaks: [-1.0, 1.0]
  weights: [0.5, 0.5]     # symmetric Nash: 0.5/0.5 over the two peaks
  width: 0.1
  coupling: 1.0

network:
  hidden_dims: [64, 64]
  activation: gelu
  normalization: rms_norm
  num_components: 2
  clip_means: false        # (default) off repo-wide; see failing_gaussian_wo_magnet
                            #   README for why turning this on can zero the
                            #   gradient of a mean sitting exactly at the box edge
                            #   (which is exactly where this config's init sits)

optimizer:
  learning_rate: 0.001  # PPO network setting; the idealized copy uses 0.05
  max_grad_norm: 0.5
  optimizer: adam
  weight_decay: 0.0        # only used by "adamw" and "muon"

ppo:
  clip_eps: 0.1
  value_coef: 0.5
  batch_size: 256
  ppo_epochs: 1

  # Target/magnet parameter tracking.
  target_tau: 0.001
  magnet_interval: 1000

  # Entropy bonus, split per head.
  category_entropy_coef: 0.03
  gaussian_entropy_coef: 0.03

  # KL regularization, split per head (0 disables a term).
  trpo_category_kl_coef: 0.05
  trpo_gaussian_kl_coef: 0.05
  magnet_category_kl_coef: 0.2
  magnet_gaussian_kl_coef: 0.2

train:
  mode: self_play    # "self_play" or "fixed_opponent"
  perspective: 0       # fixed_opponent: which player trains
  opponent: random      # fixed_opponent: "random" or "static"
  steps: 100
  epochs: 2000
  checkpoint_dir: data/bad_initialization
  seed: 0

idealized:
  # --- payoff backend ---
  backend: auto             # auto | closed_form | quadrature
  grid_points: 801          # quadrature backend; also the grid the closed-form
                            #   backend integrates `gaussian_entropy: marginal` on
  normalize_density: true

  # --- std bounds / graduated optimization ---
  std_min: 0.001
  std_max: 1.0
  anneal_std_from: 0.0      # 0 disables

  # --- which heads train ---
  train_means: true
  train_std: true
  freeze_weights: false     # true pins the categorical head

  gaussian_entropy: marginal   # "marginal": exact differential entropy of the mixture
  kl_weighting: policy         # "policy": weight each component's Gaussian KL by its policy weight

  # --- annealed mean-repulsion sweep ---
  repulsion_coef: 0.0        # 0 disables
  repulsion_ramp: 0.2
  repulsion_hold: 0.5

  # --- the bad initialization ---
  init_means: [2.0, 2.0]     # both components start coincident, on the +1 side,
                              #   at the box edge -- far from the -1 peak
  init_weights: null          # null -> uniform (0.5/0.5) categorical start
  init_log_std: 0.0            # std = 1.0, NOT the idealized copy's 0.1.
                              #
                              #   The peaks are Gaussian bumps of `width: 0.1`, so from a
                              #   std-0.1 policy they are ~9 std away: over 20k samples from
                              #   the good init, E[D] = 1.6e-10 and not one sample has
                              #   D > 0.01. PPO then sees only the bilinear coupling term and
                              #   never moves. The idealized solver escapes this by itself --
                              #   its exact entropy gradient inflates std 0.1 -> 0.33 before
                              #   the means move -- but the PPO loss cannot: it estimates the
                              #   Gaussian entropy as `-log p(a)` at the sampled, *detached*
                              #   action, an estimator whose expectation is
                              #   `-E_{a~p}[grad log p(a)] = 0` for any parameters (measured
                              #   0.0015 +- 0.0017, vs a true dH/dlog_std of 0.2755). So the
                              #   std has to start wide enough to reach the peaks.
                              #   See testing/README.md.

  log_rows: 16
  log_out: null
  verbose: true
