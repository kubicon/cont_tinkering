# python train.py         configs/matching_pennies.yaml
# python run_idealized.py configs/matching_pennies.yaml

game:
  name: matching_pennies

network:
  hidden_dims: [64, 64]
  activation: gelu
  normalization: rms_norm
  num_components: 1
  clip_means: true      # project the mean head onto the action box, as run_idealized.py
                        #   does after every step. Without it train.py's means diffuse to
                        #   |mu| ~ 1e3: past the box every sample clips to the same corner,
                        #   so the payoff stops depending on this player's action and
                        #   advantage normalization + Adam keep the step at ~lr anyway.

optimizer:
  learning_rate: 0.05   # big enough that the bilinear rotation is visible in 20k iters
  max_grad_norm: 0.5
  optimizer: adam
  weight_decay: 0.0

ppo:
  clip_eps: 0.1
  value_coef: 0.5
  batch_size: 256
  ppo_epochs: 1
  target_tau: 0.001
  magnet_interval: 500
  category_entropy_coef: 0.1
  gaussian_entropy_coef: 0.1
  trpo_category_kl_coef: 0.05
  trpo_gaussian_kl_coef: 0.05
  magnet_category_kl_coef: 0.2
  magnet_gaussian_kl_coef: 0.0

train:
  mode: self_play
  perspective: 0
  opponent: random
  steps: 50
  epochs: 200
  checkpoint_dir: data/matching_pennies
  seed: 123

idealized:
  backend: quadrature
  grid_points: 2001
  normalize_density: true

  std_min: 0.005
  std_max: 0.5

  train_means: true
  train_std: true
  freeze_weights: false

  gaussian_entropy: marginal
  kl_weighting: policy

  anneal_std_from: 0.0
  repulsion_coef: 0.0
  repulsion_ramp: 0.2
  repulsion_hold: 0.5

  init_means: [1.0]     # start OFF the Nash. `spread` puts the single component at the
                        #   box midpoint 0.5, which IS a Nash here (payoff is bilinear, so
                        #   only the mean matters) -- the run then sits at a fixed point
                        #   from step 0 and "converges" without ever taking a real step.
  init_weights: [0.3]
  init_log_std: 0.1

  log_rows: 16
  log_out: null
  verbose: true
