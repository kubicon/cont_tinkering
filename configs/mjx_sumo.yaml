# python train.py configs/mjx_sumo.yaml
#
# `disk_sumo` played on MuJoCo/MJX physics (see `games/mjx_sumo.py`): the same
# game -- same 11-dimensional observation, same egocentric force in `[-1, 1]^2`,
# same payoff -- with MuJoCo's constraint solver in place of the hand-rolled
# penalty spring. Everything below is `configs/disk_sumo.yaml` except the game
# block's contact parameters and a smaller `train` budget, since MJX costs far
# more per step than the hand-rolled integrator.
#
# MJX is built for GPU: on CPU this is slow enough to be a smoke test only.
# On a GPU, raise `ppo.batch_size` and `train.epochs` back to the `disk_sumo`
# values and watch memory -- an `mjx.Data` rides in the rollout's scan carry,
# so the batch is what will run you out of it first.
#
# There is no exact best response, so nothing prints an exploitability column
# while training -- measure the checkpoint afterwards with
# `python best_response.py configs/mjx_sumo_br.yaml`.

game:
  name: mjx_sumo
  # Warp on an NVIDIA-backed JAX installation, JAX for local CPU smoke tests.
  # `warp_naconmax` is global across a vmapped batch: 20,000 covers both the
  # training batch and mjx_sumo_br.yaml's largest evaluation batch. This puck
  # model has at most one contact per world; `warp_njmax` is per world.
  physics_backend: auto
  warp_naconmax: 20000
  warp_njmax: 8
  # Start with Warp's device default. Benchmark `warp_staged` if profiling
  # shows repeated CUDA graph captures inside the training scans.
  warp_graph_mode: auto
  horizon: 250            # control steps; 2 * horizon decisions, 25 s at dt 0.1
  ring_radius: 1.0
  disk_radius: 0.15
  start_distance: 0.6     # centre-to-centre at the start
  start_jitter: 0.05      # per-coordinate start noise
  random_orientation: true
  egocentric: true
  dt: 0.1                 # seconds per control step
  substeps: 10            # mjx.step calls per control step; timestep = dt / substeps
  mass: 1.0
  max_force: 1.0
  # Joint damping, and the same change `configs/disk_sumo.yaml` explains: at
  # drag 1 velocity tracked force within a control step and two equal pucks
  # pushing head-on could never move each other, so every bout was a draw.
  # `mass / drag` is now 2 s against a 5 s bout, and top speed is 2.
  #
  # The other half of that fix, `random_start`, is `disk_sumo`-only for now --
  # `MjxSumoBase` still opens every bout with the two bodies facing each other.
  drag: 0.5               # joint damping
  # MuJoCo contact softness, as (timeconst, dampratio) -- `disk_sumo`'s
  # stiffness / contact_damping in the units the solver takes. Smaller
  # timeconst is a harder contact; dampratio 1 is critically damped.
  solref_timeconst: 0.02
  solref_dampratio: 1.0
  # There is one contact in the model, so it converges in far fewer than
  # MuJoCo's default 100 iterations. Raising these costs time for nothing here.
  solver_iterations: 4
  solver_ls_iterations: 8
  # Random play pushes somebody out in only ~7% of bouts, so pure sumo starts
  # with almost no signal. Two ways to add one, on the same distance gap
  # `phi = (d_1 - d_0) / ring_radius` (distances from the centre):
  #   margin_weight  -- a terminal tie-breaker, `margin_weight * phi`, paid only
  #                     when nobody is pushed out. Keep it below 1.
  #   shaping_weight -- dense potential-based shaping, `w * (phi' - phi)` per
  #                     step. Undiscounted it telescopes to the same kind of
  #                     terminal term, but arrives as it happens -- which only a
  #                     bootstrapping estimator (`ppo.advantage: vtrace`) uses.
  margin_weight: 0.3
  shaping_weight: 0.5

network:
  policy: gaussian_mixture  # the only policy a sequential game supports
  hidden_dims: [128, 128]
  activation: gelu
  normalization: rms_norm
  num_components: 4
  # Per-component covariance. The action is 2-D, so a full covariance can tilt a
  # component's ellipse; diagonal keeps it axis-aligned.
  full_covariance: false
  scale_parameterization: log   # "log" or "linear"
  max_correlation: 0.0          # full_covariance + log only; 0 = unbounded
  sigma_min: 0.1               # null = built-in floor (1e-3)
  sigma_max: null               # null = box width
  # Confine each component to its own bucket of the box (equal-area boxes, any
  # num_components; a regular grid for 1, 4, 9, ...). Pair with sigma_min ~
  # bucket/4, a bucket being ~ box width / sqrt(num_components) across.
  bucket_means: true
  clip_means: true        # keep the means in the [-1, 1]^2 force box
  mean_box_penalty_coef: 1.0    # pulls drifted means back to the box edge

optimizer:
  learning_rate: 0.0003
  max_grad_norm: 0.5
  optimizer: adam         # see training/optimizers.py for the choices
  weight_decay: 0.0       # only used by adamw / muon

ppo:
  clip_eps: 0.1
  value_coef: 0.5
  batch_size: 64          # MJX is the cost here; raise this on a GPU
  ppo_epochs: 1
  target_tau: 0.001
  magnet_interval: 4000

  # With this probability a sampled force is replaced by a uniform draw on the
  # box (on the component's bucket under `network.bucket_means`); V-trace
  # importance-weights it back to the policy. 0 disables.
  explore_eps: 0.05

  # V-trace over each player's own decisions (`training/vtrace.py`). gamma 1
  # keeps the zero-sum objective; lambda < 1 is the variance reduction. The
  # importance weights correct a player's own exploration (`explore_eps`) and
  # any drift over `ppo_epochs`; `vtrace_opponent_correction` handles the opponent's.
  advantage: vtrace
  gamma: 1.0
  vtrace_lambda: 0.95
  vtrace_rho_bar: 2.0
  vtrace_c_bar: 1.0
  # Correct the opponent's exploration after each own decision; not before it
  # (fully observed state: the past only reweights states, see training/vtrace.py).
  vtrace_opponent_correction: future

  # No atoms: the categorical head only picks which force component to use.
  category_entropy_coef: 0.04
  gaussian_entropy_coef: 0.04

  trpo_category_kl_coef: 0.05
  trpo_gaussian_kl_coef: 0.05
  magnet_category_kl_coef: 0.2
  magnet_gaussian_kl_coef: 0.2

train:
  mode: self_play         # the only mode a sequential game supports
  steps: 100               # outer steps: each logs and writes a checkpoint
  epochs: 4000            # raise on a GPU
  checkpoint_dir: data/mjx_sumo
  seed: 0
