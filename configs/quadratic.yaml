game:
  name: quadratic
  dim: 1              # 1 keeps this comparable to configs/idealized_quadratic.yaml
                       #   (run_idealized's quadrature backend only supports 1-D games)
  coupling: 0.5        # |coupling| < 2 keeps the origin the unique saddle
  bound: 3.0           # action space is [-bound, bound]^dim for both players

network:
  hidden_dims: [64, 64]   # (default)
  activation: gelu        # (default)
  normalization: rms_norm # (default)
  num_components: 1      # (default) mixture components per player's policy
  full_covariance: false # (default) a full Cholesky covariance factor per component
                         #   instead of a diagonal one. Read by both scripts (the solver
                         #   inherits it unless `idealized.full_covariance` overrides),
                         #   and inert on any game whose payoff separates over a
                         #   player's own coordinates -- which this one does.

optimizer:
  learning_rate: 0.001  # (default)
  max_grad_norm: 0.5    # (default)
  optimizer: adam        # (default) adam | adamw | muon
  weight_decay: 0.0      # (default) only adamw/muon support this

ppo:
  clip_eps: 0.1          # (default)
  value_coef: 0.5        # (default)
  batch_size: 256        # (default) num_envs
  ppo_epochs: 1          # (default)

  # --- target/magnet parameter tracking ---
  target_tau: 0.001       # (default) EMA rate for the target/magnet network
  magnet_interval: 500    # (default) steps between hard magnet snapshots

  # --- entropy bonus, split per head ---
  category_entropy_coef: 0.1  # (default)
  gaussian_entropy_coef: 0.1  # (default)

  # --- KL regularization, split per head (0 disables a term) ---
  trpo_category_kl_coef: 0.05    # (default) KL(new || old), trust-region style
  trpo_gaussian_kl_coef: 0.00    # (default)
  magnet_category_kl_coef: 0.2   # (default) KL(new || magnet), proximal anchor
  magnet_gaussian_kl_coef: 0.0   # (default)

train:
  mode: self_play    # self_play | fixed_opponent
  perspective: 0          # (default) fixed_opponent: which player (0 or 1) trains
  opponent: random         # fixed_opponent: random | static. random samples the box
                           #   uniformly; the Nash exploits neither so this is a sane
                           #   sanity check before trying self_play.

  steps: 200               # (default) outer steps (each logs + checkpoints once)
  epochs: 200               # (default) inner training iterations per outer step
  checkpoint_dir: data/quadratic  # set to null to disable checkpointing
  seed: 123                  # (default)

# Consumed by `run_idealized.py` only; `train.py` accepts and ignores this section,
# so this one file runs both the PPO trainer and the exact-gradient solver:
#
#   python train.py         configs/quadratic.yaml   # sampled, function approximator
#   python run_idealized.py configs/quadratic.yaml   # exact, no network, same hparams
#
# Every field is at its default; see `IdealizedSection` in run_idealized.py.
idealized:
  backend: auto            # (default) auto-picks `quadrature` -- this game has no closed
                           #   form. `sampled` is the middle ground with train.py: same
                           #   tabular mirror step, but the payoff integral becomes an
                           #   average over `samples` action draws per iteration.
  grid_points: 801         # (default) quadrature resolution *per axis*; raise if a std
                           #   collapses below the resulting dx (the run warns when it does).
                           #   Under `backend: sampled` the grid is used only for the
                           #   reported exploitability.
  max_quadrature_gib: 2.0  # (default) refuse a payoff matrix bigger than this rather than
                           #   dying in the allocator. The matrix has grid_points^(2*dim)
                           #   entries, so above 1-D either drop grid_points to a few dozen
                           #   or use `backend: sampled`, whose cost is dimension-free.
  normalize_density: true  # (default) renormalize each component on the grid

  full_covariance: null    # (default) null inherits `network.full_covariance`

  # --- `backend: sampled` only; ignored by the other two backends ---
  samples: null            # (default) null = ppo.batch_size draws per iteration
  sample_seed: null        # (default) null = train.seed
  q_estimator: responsibility  # (default) responsibility | per_component | onpolicy
  grad_estimator: pathwise     # (default) pathwise | score (REINFORCE, as PPO's surrogate)
  entropy_source: sampled      # (default) sampled = -log p at the drawn action, exactly
                               #   what mixture_ppo_loss adds (and whose gradient is
                               #   mean-zero); exact = the grid integral

  std_min: 0.001           # (default) mirrors `training.mixture.LOG_STD_MIN`
  std_max: null            # (default) null = `high - low`, the trainer's own ceiling

  train_means: true        # (default)
  train_std: true          # (default)
  freeze_weights: false    # (default) true pins the categorical head

  # Faithfulness to the *sampled* objective. Both defaults match what
  # `mixture_ppo_loss` actually estimates; flip them to the legacy terms
  # ("component" / "uniform") to reproduce configs/idealized_*.yaml behaviour.
  gaussian_entropy: marginal  # (default) exact differential entropy of the mixture
  kl_weighting: policy        # (default) weight each component's KL by its probability

  # Graduated optimization / mean-repulsion sweep: no PPO counterpart, off by default.
  anneal_std_from: 0.0     # (default) 0 disables
  repulsion_coef: 0.0      # (default) 0 disables
  repulsion_ramp: 0.2      # (default)
  repulsion_hold: 0.5      # (default)

  # Initial mixture. The defaults reproduce the trainer's own init exactly.
  init_means: spread       # (default) component k at (k+0.5)/K of the box
  init_weights: null       # (default) null = uniform
  init_log_std: null       # (default) null = (high-low)/(2K)

  log_rows: 16             # (default) rows in the summary table
  log_out: null            # (default) null = <train.checkpoint_dir>/idealized_history.json
  verbose: true            # (default) one line per outer step
