# Glicksberg & Gross (1953): (1+x)(1+y)(1-xy)/(1+xy)^2 on [0, 1]^2.
# Unique Nash has CDF (4/pi) arctan sqrt(t) -- a density unbounded at 0, hence
# diffuse in a way no Gaussian mixture and no coarse grid represents well.
# Value: 4/pi ~ 1.2732.
game:
  name: glicksberg_gross

network:
  hidden_dims: [64, 64]
  activation: gelu
  normalization: rms_norm
  num_components: 8

optimizer:
  learning_rate: 0.0003
  max_grad_norm: 1.0
  optimizer: muon
  weight_decay: 0.01  # only used by "adamw" and "muon"

ppo:
  clip_eps: 0.1
  value_coef: 0.5
  batch_size: 256
  ppo_epochs: 2

  # Target/magnet parameter tracking.
  target_tau: 0.001
  magnet_interval: 500

  # Entropy bonus, split per head.
  category_entropy_coef: 0.1
  gaussian_entropy_coef: 0.1

  # KL regularization, split per head (0 disables a term).
  trpo_category_kl_coef: 0.05
  trpo_gaussian_kl_coef: 0.05
  magnet_category_kl_coef: 0.2
  magnet_gaussian_kl_coef: 0.2

train:
  mode: self_play    # "self_play" or "fixed_opponent"
  perspective: 0      # fixed_opponent: which player trains
  opponent: random     # fixed_opponent: "random" or "static"
  steps: 100
  epochs: 500
  checkpoint_dir: sweeps/glicksberg_gross
  seed: 0
