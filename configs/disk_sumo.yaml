# python train.py configs/disk_sumo.yaml
#
# Two disks pushing each other out of a ring, with continuous 2-D forces (see
# `games/disk_sumo.py`). Sequential, so `train.py` runs
# `SequentialSelfPlayPPOTrainer`; the schema is otherwise the shared one.
#
# Each control step is two decisions (player 0 chooses, then player 1 chooses
# without seeing it), so `horizon: 50` is a 100-decision episode. That is long
# for a Monte Carlo return, so this config bootstraps with V-trace
# (`ppo.advantage: vtrace`) from the dense shaping reward.
#
# The action is a force in the player's egocentric frame (x towards the
# opponent), in `[-1, 1]^2`; `clip_means: true` keeps the components inside it.
#
# There is no exact best response, so nothing prints an exploitability column
# while training -- measure the checkpoint afterwards with
# `python best_response.py configs/disk_sumo_br.yaml`.

game:
  name: disk_sumo
  horizon: 100             # control steps; 2 * horizon decisions
  ring_radius: 1.0
  disk_radius: 0.15
  start_distance: 0.6     # centre-to-centre at the start
  start_jitter: 0.05      # per-coordinate start noise
  random_orientation: true
  # Place both disks uniformly in the ring every bout, rather than facing each
  # other across the centre. A symmetric start invites a symmetric stalemate --
  # two equal disks pushing head-on cannot gain ground on each other, whatever
  # the horizon -- and a policy trained only on it has never played from the
  # rim. Measured: random play decides 36% of bouts from random starts against
  # 8% from the facing start. `start_distance`, `start_jitter` and
  # `random_orientation` are then unused (they still place the fallback start).
  random_start: true
  egocentric: true
  dt: 0.1                 # seconds per control step
  substeps: 10
  mass: 1.0
  max_force: 1.0
  # Momentum, not treacle. `mass / drag` is how long a disk keeps its speed: at
  # drag 1 that was one control step, so velocity tracked force and a head-on
  # push cancelled instantly -- nobody could ever be moved. At drag 0.5 it is
  # 2 s against a 5 s bout, and top speed (`max_force / drag`) is 2.
  drag: 0.5
  # The contact spring has to stop faster disks now: at stiffness 100 a head-on
  # charge squashed the pair 29% into each other. 400 brings that back to 14%,
  # with the damping raised alongside it to keep the same 0.35 damping ratio.
  stiffness: 400.0
  contact_damping: 10.0
  # Random play decides ~64% of bouts under the start and physics above (it was
  # ~7% with the facing start and drag 1), so the two terms below are now a
  # refinement rather than the only signal there is. Both act on the same
  # distance gap `phi = (d_1 - d_0) / ring_radius` (distances from the centre):
  #   margin_weight  -- a terminal tie-breaker, `margin_weight * phi`, paid only
  #                     when nobody is pushed out. Keep it below 1.
  #   shaping_weight -- dense potential-based shaping, `w * (phi' - phi)` per
  #                     step. Undiscounted it telescopes to the same kind of
  #                     terminal term, but arrives as it happens -- which only a
  #                     bootstrapping estimator (`ppo.advantage: vtrace`) uses.
  margin_weight: 0.0
  shaping_weight: 0.0

network:
  policy: gaussian_mixture  # the only policy a sequential game supports
  hidden_dims: [128, 128]
  activation: gelu
  normalization: rms_norm
  num_components: 4
  # Per-component covariance. The action is 2-D, so a full covariance can tilt a
  # component's ellipse; diagonal keeps it axis-aligned.
  full_covariance: false
  scale_parameterization: log   # "log" or "linear"
  max_correlation: 0.0          # full_covariance + log only; 0 = unbounded
  sigma_min: 0.1               # null = built-in floor (1e-3)
  sigma_max: null               # null = box width
  # Confine each component to its own bucket of the box (equal-area boxes, any
  # num_components; a regular grid for 1, 4, 9, ...). Pair with sigma_min ~
  # bucket/4, a bucket being ~ box width / sqrt(num_components) across.
  bucket_means: false
  clip_means: true        # keep the means in the [-1, 1]^2 force box
  mean_box_penalty_coef: 1.0    # pulls drifted means back to the box edge

optimizer:
  learning_rate: 0.0003
  max_grad_norm: 0.5
  optimizer: adam         # see training/optimizers.py for the choices
  weight_decay: 0.0       # only used by adamw / muon

ppo:
  clip_eps: 0.1
  value_coef: 0.5
  batch_size: 512
  ppo_epochs: 1
  target_tau: 0.001
  magnet_interval: 4000

  # With this probability a sampled force is replaced by a uniform draw on the
  # box (on the component's bucket under `network.bucket_means`); V-trace
  # importance-weights it back to the policy. 0 disables.
  explore_eps: 0.0

  # V-trace over each player's own decisions (`training/vtrace.py`). gamma 1
  # keeps the zero-sum objective; lambda < 1 is the variance reduction. The
  # importance weights correct a player's own exploration (`explore_eps`) and
  # any drift over `ppo_epochs`; the opponent's moves are environment.
  advantage: vtrace
  gamma: 1.0
  vtrace_lambda: 0.95
  vtrace_rho_bar: 1.0
  vtrace_c_bar: 1.0

  # No atoms: the categorical head only picks which force component to use.
  category_entropy_coef: 0.04
  gaussian_entropy_coef: 0.04

  trpo_category_kl_coef: 0.05
  trpo_gaussian_kl_coef: 0.05
  magnet_category_kl_coef: 0.2
  magnet_gaussian_kl_coef: 0.2

train:
  mode: self_play         # the only mode a sequential game supports
  steps: 10               # outer steps: each logs and writes a checkpoint
  epochs: 4000             # training iterations per outer step
  checkpoint_dir: data/disk_sumo
  seed: 0
