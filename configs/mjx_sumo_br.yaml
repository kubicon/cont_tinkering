# python best_response.py configs/mjx_sumo_br.yaml
#
# Measures the strategies in `data/mjx_sumo` (written by `python train.py
# configs/mjx_sumo.yaml`) by training a best response to each of them. The
# printed exploitability is a *lower bound*: read the `br_value` column and only
# trust the number once it has stopped climbing.
#
# The game is read from the `config.yaml` that `train.py` saves into the
# checkpoint directory, so there is no `game` section here. `network` here
# describes the *responder*; `num_components` has to match the checkpoint's,
# because a batched rollout selects between the two players' categorical heads
# and they must be the same width.

best_response:
  checkpoint_dir: data/mjx_sumo
  checkpoint_step: null   # null = the last checkpoint written
  responder: both         # 0, 1, or both (both also reports exploitability)
  # Which of the checkpoint's two strategies to measure: the last iterate
  # ("live"), the Polyak average ("target"), or "both". Self-play often
  # converges in the average while the live iterate is still orbiting, so
  # a gap between the two bounds is a diagnosis, not noise. Checkpoints
  # written before target params were saved only hold the live one.
  opponent_iterate: live
  eval_episodes: 200000
  # The checkpoint's `warp_naconmax` is 20,000 and the puck has one contact per
  # world, so this is the largest batch the saved game can step.
  eval_batch_size: 20000
  eval_seed: 12345
  progress_episodes: 20000

network:
  # The same capacity as the strategy under test: a smaller responder
  # understates how exploitable it is.
  hidden_dims: [512, 512, 512]
  activation: gelu
  normalization: rms_norm
  num_components: 4   # must match the checkpoint's
  clip_means: true

optimizer:
  learning_rate: 0.0003
  max_grad_norm: 0.5
  optimizer: adam
  weight_decay: 0.0

ppo:
  clip_eps: 0.1
  value_coef: 0.5
  batch_size: 2048        # the training run's batch; `warp_naconmax` covers it
  ppo_epochs: 1

  # A best response faces a *fixed* opponent, so it is a plain maximization
  # against a stationary MDP -- not an equilibrium problem. Every regularizer
  # that exists to stabilize self-play biases the responder towards its own past
  # iterate and so makes the strategy under test look less exploitable than it
  # is. All of them are off here, and they should stay off.
  target_tau: 0.001     # unused: nothing reads target_params on this path
  magnet_interval: 500
  trpo_category_kl_coef: 0.0
  trpo_gaussian_kl_coef: 0.0
  magnet_category_kl_coef: 0.0
  magnet_gaussian_kl_coef: 0.0

  # Exploration only. Enough to find the exploiting line, small enough not to
  # blunt it -- the greedy readout is the one that is unaffected either way.
  category_entropy_coef: 0.005
  gaussian_entropy_coef: 0.005

  # The same estimator as the training run. Against a fixed opponent and
  # on-policy, every importance weight is 1 and this is plain TD(lambda).
  advantage: vtrace
  gamma: 1.0
  vtrace_lambda: 0.95

train:
  # 32,000 iterations per responder, both in one 24 h slot. Self-play ran at
  # ~1.1 s/iter on an A100 and a best response updates one network instead of
  # two, so this is <= ~20 h total, leaving
  # the rest of a 24 h slot for compilation, progress evals and the final eval.
  steps: 16
  epochs: 2000
  seed: 0
  # `mode` and `checkpoint_dir` are ignored here: a best response is a
  # measurement of somebody else's strategy, not a strategy to keep.
