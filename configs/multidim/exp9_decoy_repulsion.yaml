# Exp 9 -- the mean-repulsion SWEEP: the one gradient-only knob that escapes the decoy trap
# in 1-D (configs/idealized_decoy_sweep.yaml), lifted to 2-D. Tuning mirrors the 1-D sweep:
# frozen uniform weights, narrow std ceiling (components stay sighted, never widen into the
# decoy), light magnet (its pull on the mean is a brake), start ON the decoy. Per-axis L1
# repulsion pushes the two components apart until each finds a peak.
game:
  name: multidim_decoy_well
  dim: 2
  peaks: [-1.0, 1.0]
  peak_width: 0.05
  peak_height: 1.0
  decoys: [[0.0, 0.7, 0.45]]
  coupling: 1.0
  action_margin: 2.0
mmd:
  lr: 0.05
  steps: 40000
  magnet_coef: 0.05
  num_components: 2
  freeze_weights: true
  std_max: 0.10
  repulsion_coef: 3.0
  repulsion_ramp: 0.2
  repulsion_hold: 0.5
init:
  means: [[-0.05, -0.05], [0.05, 0.05]]   # start ON the decoy
  log_std: 0.05
log:
  every: 1000
  rows: 12
