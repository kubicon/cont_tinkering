# python train.py configs/mjx_spider_sumo.yaml
#
# Two three-legged walkers pushing each other out of a ring: `mjx_ant_sumo`'s
# body family with a different leg count (see `games/mjx_sumo.py`). The action
# is 6 joint torques in `[-1, 1]^6`, the observation is 57-dimensional, and a
# walker loses by leaving the ring or by ending up on its back.
#
# A tripod has no stability margin, so bouts are decided by knockdown far
# more often than they are for the ant. The cheapest of the three.
#
# This is far heavier than `configs/mjx_sumo.yaml`: two walkers run a couple of
# hundred contact slots and the whole `mjx.Data` rides in the rollout's scan
# carry, so GPU memory, not compute, is what caps the batch. The numbers below
# are a starting point for a GPU, and a smoke test at best on CPU.
#
# Expect the pure-sumo reward to be far too sparse on its own: random torques
# neither push anyone out nor knock anyone over, which is why Bansal et al.
# needed a dense exploration reward annealed away over training. `shaping_weight`
# is the hook here, but it is a fixed constant -- a schedule is the obvious
# next thing this config wants.
#
# There is no exact best response; measure checkpoints with `best_response.py`.

game:
  name: mjx_spider_sumo
  # Warp on an NVIDIA-backed JAX installation, JAX for local CPU smoke tests.
  # `warp_naconmax` is global across the vmapped batch: 192 contact slots per
  # world times `ppo.batch_size` (512), the allowance the batch-scaling benchmark
  # ran with. Raise it with the batch. `warp_njmax` is per world.
  physics_backend: auto
  warp_naconmax: 98304
  warp_njmax: 384
  # Start with Warp's device default. Benchmark `warp_staged` if profiling
  # shows repeated CUDA graph captures inside the training scans.
  warp_graph_mode: auto
  # Warp prints a line per world whenever the (line search) solver hits its
  # iteration cap -- GBs of log per run. Buffer overflows still warn when off.
  warp_warn_solver_iterations: false
  horizon: 250            # control steps; 2 * horizon decisions, 12.5 s at dt 0.05
  ring_radius: 3.0
  start_distance: 2.4     # torso-to-torso at the start
  start_jitter: 0.1
  random_orientation: true
  dt: 0.05                # seconds per control step (20 Hz control)
  substeps: 5             # mjx.step calls per control step; timestep = dt / substeps
  gear: 150.0             # actuator gear: ctrl in [-1, 1] scales to joint torque
  start_height: 0.55      # the ant's standing torso height
  knockdown_height: 0.3   # below this the ant is on its back and has lost
  # Pure input normalization; a walking ant has no closed-form top speed.
  velocity_scale: 5.0
  angular_scale: 10.0
  joint_velocity_scale: 10.0
  solver_iterations: 4
  solver_ls_iterations: 8
  margin_weight: 0.0
  shaping_weight: 0.5

network:
  policy: gaussian_mixture  # the only policy a sequential game supports
  hidden_dims: [512, 512, 512]
  activation: gelu
  normalization: rms_norm
  num_components: 4
  # Per-component covariance. The action is 8-D; a full covariance there is a
  # lot of parameters per component for little gain, so keep it diagonal.
  full_covariance: false
  scale_parameterization: log   # "log" or "linear"
  max_correlation: 0.0          # full_covariance + log only; 0 = unbounded
  sigma_min: 0.1               # null = built-in floor (1e-3)
  sigma_max: null               # null = box width
  # Bucketing grids the action box per component, which is sensible in 2-D and
  # nonsense in 8-D -- the buckets become slivers of a space no policy explores
  # that way. Off here; see `configs/mjx_sumo.yaml` for the 2-D case.
  bucket_means: false
  clip_means: true        # keep the means in the [-1, 1]^6 torque box
  mean_box_penalty_coef: 1.0    # pulls drifted means back to the box edge
  # `policy: exp_family` only (one-shot games; a sequential run rejects it), so
  # inert here -- listed so the file shows every field.
  grid_points: 256
  num_basis: 8
  poly_order: 2
  basis_width_scale: 1.0
  init_tilt: 0.0

optimizer:
  learning_rate: 0.0003
  max_grad_norm: 0.5
  optimizer: adam         # see training/optimizers.py for the choices
  weight_decay: 0.0       # only used by adamw / muon

ppo:
  clip_eps: 0.1
  value_coef: 0.5
  batch_size: 512         # throughput plateaus here (A100, Warp); see logs/mjx_batch_scaling.log
  ppo_epochs: 1
  target_tau: 0.001
  magnet_interval: 4000

  # With this probability a sampled force is replaced by a uniform draw on the
  # box (on the component's bucket under `network.bucket_means`); V-trace
  # importance-weights it back to the policy. 0 disables.
  explore_eps: 0.2

  # V-trace over each player's own decisions (`training/vtrace.py`). gamma 1
  # keeps the zero-sum objective; lambda < 1 is the variance reduction. The
  # importance weights correct a player's own exploration (`explore_eps`) and
  # any drift over `ppo_epochs`; `vtrace_opponent_correction` handles the opponent's.
  advantage: vtrace
  gamma: 1.0
  vtrace_lambda: 0.95
  vtrace_rho_bar: 2.0
  vtrace_c_bar: 1.0
  # Correct the opponent's exploration both after each own decision and before
  # it (see training/vtrace.py). The past weights are floored at
  # `vtrace_opponent_past_floor`; "range" smooths each opponent row's continuous
  # value towards uniform instead of flooring the product, so states only
  # exploration reaches keep the opponent's policy over kinds of action.
  vtrace_opponent_correction: future_and_past
  vtrace_opponent_past_floor: 0.1
  vtrace_opponent_past_floor_mode: range   # "cumulative" or "range"

  # No atoms: the categorical head only picks which torque component to use.
  category_entropy_coef: 0.04
  gaussian_entropy_coef: 0.04

  trpo_category_kl_coef: 0.05
  trpo_gaussian_kl_coef: 0.05
  magnet_category_kl_coef: 0.2
  magnet_gaussian_kl_coef: 0.2

  # Categorical head update: "ppo" (clipped surrogate) or "neurd" (Neural
  # Replicator Dynamics; centered logits kept in [-neurd_beta, neurd_beta],
  # per-entry advantage clipped to neurd_clip).
  category_update: ppo
  neurd_beta: 2.0
  neurd_clip: 10.0
  # Standardize the advantage per player over the batch; false keeps payoff units.
  normalize_advantage: true
  # Probability floor on the categorical head; "kind" or "entry". 0 disables.
  category_floor: 0.01
  category_floor_coef: 0.01
  category_floor_mode: entry

  # `policy: exp_family` only; null reuses the matching `*_gaussian_*` value.
  density_entropy_coef: null
  trpo_density_kl_coef: null
  magnet_density_kl_coef: null

train:
  mode: self_play         # the only mode a sequential game supports
  # `train_sequential.py` only; `train.py` always runs self-play.
  solver: self_play
  # `mode: fixed_opponent` only.
  perspective: 0
  opponent: random
  steps: 100               # outer steps: each logs and writes a checkpoint
  epochs: 4000            # raise on a GPU
  checkpoint_dir: data/mjx_spider_sumo
  seed: 0
