# Best-response measurement for configs/disk_sumo_v2.yaml. The game is read
# from the `config.yaml` that `train.py` saves into the checkpoint directory.

best_response:
  checkpoint_dir: data/disk_sumo_v2
  checkpoint_step: null
  responder: both
  opponent_iterate: both
  eval_episodes: 200000
  eval_batch_size: 20000
  eval_seed: 12345
  progress_episodes: 20000

network:
  hidden_dims: [64, 64]
  activation: gelu
  normalization: rms_norm
  num_components: 4
  clip_means: true

optimizer:
  learning_rate: 0.003
  max_grad_norm: 0.5
  optimizer: adam
  weight_decay: 0.0

ppo:
  clip_eps: 0.1
  value_coef: 0.5
  batch_size: 512
  ppo_epochs: 1
  target_tau: 0.001
  magnet_interval: 500
  trpo_category_kl_coef: 0.0
  trpo_gaussian_kl_coef: 0.0
  magnet_category_kl_coef: 0.0
  magnet_gaussian_kl_coef: 0.0
  category_entropy_coef: 0.005
  gaussian_entropy_coef: 0.005
  advantage: vtrace
  gamma: 1.0
  vtrace_lambda: 0.95

train:
  steps: 40
  epochs: 300
  seed: 0
